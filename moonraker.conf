# KILN_IFSJacker's Moonraker part (Kiln OS includes it while the plugin is
# on): updates from Mainsail or Fluidd (Software Updates). After an
# update, run RESTART: it loads the new code.
# No managed_services: Kiln's Moonraker can't restart services
# (provider: none), so the update would end in an error.
[update_manager kiln-ifsjacker]
type: git_repo
path: /data/ad5x/plugins/ifsjacker
origin: https://github.com/DIEHARDave/ifs_jacker_plugin.git
primary_branch: kiln
is_system_service: False
