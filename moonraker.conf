# KILN_IFSJacker's Moonraker part (Kiln OS includes it while the plugin is
# on): updates from Mainsail or Fluidd (Software Updates). Klipper restarts
# after an update, which loads the new code.
[update_manager kiln-ifsjacker]
type: git_repo
path: /data/ad5x/plugins/ifsjacker
origin: https://github.com/DIEHARDave/ifs_jacker_plugin.git
primary_branch: kiln
is_system_service: False
managed_services: klipper
