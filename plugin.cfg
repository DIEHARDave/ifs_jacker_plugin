# KILN_IFSJacker: IFS Jacker support on Kiln OS. See README.md.
#
# Kiln's ifs.py drives the Jacker's channels itself ([ifs] channels: auto
# reads the channel_count the Jacker reports). This plugin adds the
# Jacker's own parts: IFS_JACKER_STATUS, IFS_JACKER_PERIPHERALS,
# IFS_JACKER_PERIPHERAL, IFS_JACKER_CHECK, printer.kiln_ifsjacker, and the
# "ifs_jacker" temperature sensor type.
#
# Kiln includes this file while the plugin is enabled, and plugin updates
# replace it. Peripherals go in local.cfg, for example:
#
#   [temperature_sensor ifs_box]
#   sensor_type: ifs_jacker
#   peripheral: 0          # index in IFS_JACKER_PERIPHERALS
#   #field: temperature    # the p<n>_<field> value the Jacker reports
#   #factor: 1.0
#
#   [kiln_ifsjacker_fan rear]
#   peripheral: 1          # a pwm_output peripheral; SET_FAN_SPEED FAN=rear

[kiln_ifsjacker]
