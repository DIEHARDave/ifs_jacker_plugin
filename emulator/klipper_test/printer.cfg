# Test printer for Kiln OS's ifs.py against the IFS Jacker emulator. Klipper
# runs in batch mode against a linux-process MCU dictionary (no hardware),
# so moves complete at once and heaters never warm (min_extrude_temp: 0).
[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[stepper_x]
step_pin: gpio0
dir_pin: gpio1
enable_pin: !gpio2
microsteps: 16
rotation_distance: 40
endstop_pin: gpio3
position_endstop: 0
position_max: 220

[stepper_y]
step_pin: gpio4
dir_pin: gpio5
enable_pin: !gpio6
microsteps: 16
rotation_distance: 40
endstop_pin: gpio7
position_endstop: 0
position_max: 220

[stepper_z]
step_pin: gpio8
dir_pin: gpio9
enable_pin: !gpio10
microsteps: 16
rotation_distance: 8
endstop_pin: gpio11
position_endstop: 0
position_max: 220

[extruder]
step_pin: gpio12
dir_pin: gpio13
enable_pin: !gpio14
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: gpio15
sensor_type: EPCOS 100K B57560G104F
sensor_pin: analog0
control: watermark
min_temp: -273
max_temp: 300
min_extrude_temp: 0
max_extrude_only_distance: 2000

[force_move]
enable_force_move: True

[save_variables]
filename: /tmp/kiln_ifs_test/variables.cfg

[virtual_sdcard]
path: /tmp/kiln_ifs_test/gcodes

[pause_resume]

[respond]

[ifs]
serial: /tmp/ifs
channels: auto
status_interval: 1
reply_timeout: 2
poll_interval: 0.2
select_timeout: 10
load_timeout: 30
unload_timeout: 30
release_timeout: 10
eject_timeout: 30
prefeed_on_insert: True
before_gcode: RESPOND MSG="before OLD={params.OLD} NEW={params.NEW}"
cut_gcode: RESPOND MSG="cut OLD={params.OLD}"
unload_gcode: RESPOND MSG="unload OLD={params.OLD} LENGTH={params.LENGTH}"
purge_start_gcode: RESPOND MSG="purge round {params.ROUND}/{params.ROUNDS}"
purge_gcode:
  M83
  G1 E{params.FLUSH} F{params.FLUSH_SPEED}
prime_gcode: RESPOND MSG="prime NEW={params.NEW}"
after_gcode: RESPOND MSG="after OLD={params.OLD} NEW={params.NEW}"
abort_gcode: RESPOND MSG="abort OLD={params.OLD} NEW={params.NEW}"

# T0-T3 as Kiln's ifs.cfg defines them; T4 and up come from ifs.py
[gcode_macro T0]
gcode: IFS_SWAP CHANNEL={printer.ifs.tool_map["0"]}
[gcode_macro T1]
gcode: IFS_SWAP CHANNEL={printer.ifs.tool_map["1"]}
[gcode_macro T2]
gcode: IFS_SWAP CHANNEL={printer.ifs.tool_map["2"]}
[gcode_macro T3]
gcode: IFS_SWAP CHANNEL={printer.ifs.tool_map["3"]}
